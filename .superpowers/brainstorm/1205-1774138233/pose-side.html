<h2>侧身姿势 · 确认</h2>
<p class="subtitle">侧身面向敌人，双手自然放松，前一后对准前方</p>

<div class="section">
  <div class="split">
    <div class="mockup">
      <div class="mockup-header">姿势示意（俯视平面图）</div>
      <div class="mockup-body" style="padding:20px;display:flex;align-items:center;justify-content:center">
        <div style="position:relative;width:300px;height:120px">
          <!-- Direction arrow (facing right = toward enemies) -->
          <div style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#888;font-size:0.8em">敌人 →</div>
          <!-- Body (side view, oval) -->
          <div style="position:absolute;left:110px;top:35px;width:24px;height:50px;background:linear-gradient(to right,#2d1b6e,#4a2a9e);border-radius:50%;border:2px solid #6930c3"></div>
          <!-- Head -->
          <div style="position:absolute;left:114px;top:12px;width:18px;height:22px;background:#f5e8d0;border-radius:50%;border:2px solid #c4a060"></div>
          <!-- Hair flowing back -->
          <div style="position:absolute;left:105px;top:14px;width:18px;height:20px;background:#c49000;border-radius:50% 0 0 50%"></div>
          <!-- Front hand (pointing forward/right) -->
          <div style="position:absolute;left:148px;top:52px;width:40px;height:8px;background:linear-gradient(to right,#8b5a00,#f0c040);border-radius:4px;transform:rotate(-5deg)"></div>
          <div style="position:absolute;left:186px;top:48px;width:10px;height:14px;background:#f5e0b0;border-radius:3px;transform:rotate(-5deg)"></div>
          <!-- Back hand (slightly behind, also pointing forward) -->
          <div style="position:absolute;left:140px;top:67px;width:35px;height:8px;background:linear-gradient(to right,#8b5a00,#d4a030);border-radius:4px;transform:rotate(-3deg)"></div>
          <div style="position:absolute;left:173px;top:64px;width:9px;height:13px;background:#f5e0b0;border-radius:3px;transform:rotate(-3deg)"></div>
          <!-- Robe back sweep -->
          <div style="position:absolute;left:76px;top:40px;width:40px;height:55px;background:linear-gradient(to left,#2d1b6e40,#1a0a3d);clip-path:polygon(100% 0%,100% 100%,0% 80%,20% 0%);border-radius:0 0 0 20px"></div>
          <!-- Gold collar suggestion -->
          <div style="position:absolute;left:108px;top:30px;width:28px;height:12px;background:#f0c040;border-radius:2px;opacity:0.8"></div>
          <!-- Floor line -->
          <div style="position:absolute;bottom:10px;left:0;right:30px;height:1px;background:#333"></div>
          <!-- Label -->
          <div style="position:absolute;left:0;top:50%;transform:translateY(-50%);color:#666;font-size:0.75em">← 背后</div>
        </div>
      </div>
    </div>

    <div class="mockup">
      <div class="mockup-header">侧面视角效果</div>
      <div class="mockup-body" style="background:#0a0508;padding:10px;display:flex;align-items:center;justify-content:center;min-height:180px">
        <!-- Side view character sketch -->
        <div style="position:relative;width:100px;height:200px">
          <!-- Robe back flow -->
          <div style="position:absolute;bottom:0;left:0;width:30px;height:160px;background:linear-gradient(to right,#1a0a3d,#2d1b6e60);clip-path:polygon(100% 0%,100% 100%,0% 90%,30% 0%);border-radius:0 0 0 20px"></div>
          <!-- Body/robe -->
          <div style="position:absolute;bottom:0;left:20px;width:28px;height:150px;background:linear-gradient(to bottom,#2d1b6e,#1a0830);border-radius:4px 4px 8px 8px"></div>
          <!-- Gold collar -->
          <div style="position:absolute;bottom:132px;left:16px;width:36px;height:22px;background:linear-gradient(to top,#8b5a00,#f0c040);clip-path:polygon(0% 100%,15% 0%,85% 0%,100% 100%)"></div>
          <!-- Head (side profile) -->
          <div style="position:absolute;bottom:158px;left:22px;width:22px;height:28px;background:linear-gradient(135deg,#f5e8d0,#e8d0a0);border-radius:40% 60% 50% 50%"></div>
          <!-- Nose suggestion -->
          <div style="position:absolute;bottom:170px;left:43px;width:5px;height:8px;background:#e0c090;border-radius:0 50% 50% 0"></div>
          <!-- Golden hair flowing back -->
          <div style="position:absolute;bottom:162px;left:14px;width:20px;height:36px;background:linear-gradient(to bottom,#f0d040,#c49000);border-radius:50% 0 0 50%;transform:rotate(10deg)"></div>
          <!-- Front arm pointing forward -->
          <div style="position:absolute;bottom:120px;left:42px;width:45px;height:9px;background:linear-gradient(to right,#8b5a00,#e8c040);border-radius:5px;transform:rotate(-8deg)"></div>
          <!-- Front hand -->
          <div style="position:absolute;bottom:115px;left:83px;width:12px;height:14px;background:#f5e0b0;border-radius:50% 50% 30% 30%"></div>
          <!-- Back arm (slightly lower, also pointing forward) -->
          <div style="position:absolute;bottom:105px;left:36px;width:38px;height:8px;background:linear-gradient(to right,#7a4e00,#c4a030);border-radius:5px;transform:rotate(-5deg)"></div>
          <!-- Back hand -->
          <div style="position:absolute;bottom:101px;left:71px;width:10px;height:12px;background:#e8d0a0;border-radius:50% 50% 30% 30%"></div>
          <!-- Subtle purple glow on hands (not orbs) -->
          <div style="position:absolute;bottom:108px;left:80px;width:20px;height:20px;background:radial-gradient(circle,rgba(157,111,255,0.3),transparent);border-radius:50%"></div>
          <!-- Legs suggestion -->
          <div style="position:absolute;bottom:0;left:24px;width:10px;height:30px;background:#1a0a3d;border-radius:0 0 4px 4px"></div>
          <div style="position:absolute;bottom:0;left:34px;width:10px;height:26px;background:#150826;border-radius:0 0 4px 4px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="section" style="background:#0f0f1a;border:1px solid #2a2a4a;border-radius:8px;padding:14px">
  <p class="label" style="color:#6060aa">姿势要点总结</p>
  <div style="color:#ccc;font-size:0.88em;line-height:1.9">
    • 侧身面向右方（朝向敌人方向，符合STS2战斗布局）<br>
    • 双手自然放松伸出，<b>前手略高，后手略低</b>，都指向前方<br>
    • 非戏剧性展开，无夸张动作——<b>沉稳的掌控感</b><br>
    • 紫色长袍从身后自然垂落/微飘<br>
    • 金色长发顺侧脸流下<br>
    • 手部可有<b>淡淡元素光晕</b>（无具体球形）
  </div>
</div>

<div class="options" style="max-width:360px;margin:0 auto">
  <div class="option" data-choice="confirm-pose" onclick="toggleSelect(this)">
    <div class="letter">✓</div>
    <div class="content"><h3>这个姿势方向正确</h3><p>进入完整规格确认</p></div>
  </div>
  <div class="option" data-choice="adjust-pose" onclick="toggleSelect(this)">
    <div class="letter">✎</div>
    <div class="content"><h3>还需要调整</h3></div>
  </div>
</div>
